{% extends "base.html" %}
{% block title %}培训 - 最后一舞{% endblock %}
{% block content %}
<div class="page-home">

  <!-- 今日复习提示 -->
  <div class="review-alert hidden" id="review-alert" onclick="startTodayReview()">
    🔔 今日有 <strong id="review-count">0</strong> 道错题需要复习，点击开始 →
  </div>

  <!-- 总览统计 -->
  <div class="stats-overview">
    <div class="stat-card">
      <div class="stat-num">{{ total_questions }}</div>
      <div class="stat-label">题库总题数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num blue" id="stat-answered">0</div>
      <div class="stat-label">已做题数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num red" id="stat-wrong">0</div>
      <div class="stat-label">错题数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num yellow" id="stat-favorites">0</div>
      <div class="stat-label">收藏数</div>
    </div>
  </div>

  <!-- 快速入口：5个按钮 -->
  <div class="quick-title">快速开始</div>
  <div class="quick-grid quick-grid-5">
    <a href="/practice" class="quick-card">
      <div class="quick-icon">📝</div>
      <div class="quick-name">开始练习</div>
    </a>
    <a href="/practice?mode=random" class="quick-card">
      <div class="quick-icon">🎲</div>
      <div class="quick-name">随机刷题</div>
    </a>
    <a href="/wrong_book" class="quick-card">
      <div class="quick-icon">❌</div>
      <div class="quick-name">错题本</div>
    </a>
    <a href="/exam" class="quick-card">
      <div class="quick-icon">📋</div>
      <div class="quick-name">模拟考试</div>
    </a>
    <div class="quick-card" onclick="startTodayReview()">
      <div class="quick-icon">🔄</div>
      <div class="quick-name">今日复习</div>
    </div>
  </div>

</div>

<!-- 5格布局补充样式 -->
<style>
.quick-grid-5 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

/* 平板：2行3列 → 最后一个居中 */
@media (max-width: 768px) {
  .quick-grid-5 {
    grid-template-columns: repeat(3, 1fr);
  }
  /* 第5个卡片在第2行，让它居中 */
  .quick-grid-5 .quick-card:last-child {
    grid-column: 2 / 3;
  }
}

/* 手机：2列 */
@media (max-width: 480px) {
  .quick-grid-5 {
    grid-template-columns: repeat(2, 1fr);
  }
  /* 手机第5个居中跨两列 */
  .quick-grid-5 .quick-card:last-child {
    grid-column: 1 / 3;
    max-width: 160px;
    margin: 0 auto;
    width: 100%;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  // ✅ 从本地读取统计数据
  const totalStats = LocalDB.getStats();
  document.getElementById('stat-answered').textContent  = totalStats.answered;
  document.getElementById('stat-wrong').textContent     = totalStats.wrong;
  document.getElementById('stat-favorites').textContent = totalStats.favorites;

  // ✅ 今日复习提示
  const reviewIds = LocalDB.getTodayReviewIds();
  if (reviewIds.length > 0) {
    document.getElementById('review-count').textContent = reviewIds.length;
    document.getElementById('review-alert').classList.remove('hidden');
  }
});

async function startTodayReview() {
  const reviewIds = LocalDB.getTodayReviewIds();
  if (reviewIds.length === 0) {
    alert('今日没有需要复习的题目 🎉');
    return;
  }
  const res = await fetch('/api/practice/start_by_ids', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({ q_ids: reviewIds }),
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  window.location.href = '/practice';
}
</script>
{% endblock %}
