<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}电力刷题系统{% endblock %}</title>

  <!-- ✅ PWA 必要标签 -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="最后一舞">

  <!-- ✅ iOS 图标（苹果不读manifest，需单独声明） -->
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="nav-brand">最后一舞 五天创造奇迹</div>
    <div class="nav-links">
      <a href="/" class="nav-item {% if request.path=='/' %}active{% endif %}">🏠 主页</a>
      <a href="/practice" class="nav-item {% if '/practice' in request.path %}active{% endif %}">📝 练习</a>
      <a href="/exam" class="nav-item {% if '/exam' in request.path %}active{% endif %}">📋 考试</a>
<a href="/exam_records" class="nav-item {% if '/exam_records' in request.path %}active{% endif %}">🏆 记录</a>
      <a href="/wrong_book" class="nav-item {% if '/wrong_book' in request.path %}active{% endif %}">❌ 错题</a>
      <a href="/stats" class="nav-item {% if '/stats' in request.path %}active{% endif %}">📊 统计</a>
      <a href="/plan" class="nav-item {% if '/plan' in request.path %}active{% endif %}">🎯 计划</a>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- local_storage.js 必须在 main.js 之前 -->
  <script src="{{ url_for('static', filename='js/local_storage.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}

  <!-- ✅ 注册 Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js')
          .then(() => console.log('✅ SW注册成功'))
          .catch(err => console.log('❌ SW注册失败', err));
      });
    }
  </script>
</body>
</html>
